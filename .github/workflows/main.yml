name: Scale Secure CI/CD

on:
  pull_request:

jobs:
  api-security-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Scale Secure API Tests
        run: |
          echo "Sending API Config to Scale Secure..."
          
          # Replace the URL below with your Ngrok URL or production Scale Secure URL
          response=$(curl -s -w "\n%{http_code}" -X POST https://nonconditional-unhaunted-blanch.ngrok-free.dev/v1/ai-testing/run \
               -H "Content-Type: application/json" \
               -d @scalesecure-tests.json)
          
          # Extract HTTP status code and body
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response: $body"
          
          # If the API returns a 500 or 400 error, fail the pipeline
          if [ "$http_code" -ne 200 ]; then
            echo "❌ Tests failed or misconfigured! Blocking Pull Request."
            exit 1
          fi
          
          # Use jq to securely parse the JSON and extract the number of failed tests
          failed_count=$(echo "$body" | jq '.summary.failed')
          
          if [ "$failed_count" -gt 0 ]; then
            echo "❌ $failed_count Vulnerabilities found! Blocking Pull Request."
            exit 1
          else
            echo "✅ All tests passed! APIs are secure."
            exit 0
          fi
